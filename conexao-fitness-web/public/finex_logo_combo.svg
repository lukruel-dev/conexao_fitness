<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cNeonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cNeonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#76e000"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>

    <linearGradient id="cChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="52%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="cGreenX" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="cSubMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="cLineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cLineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </linearGradient>

    <filter id="cGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <!-- 1. LEFT CIRCLE FX BADGE (ampliado) -->
    <g transform="translate(85, 90) scale(0.42)">
      <!-- Top-Left Cyan Arc -->
      <path d="M -130,130 A 180,180 0 1,1 170,-80" 
            fill="none" 
            stroke="url(#cNeonBlue)" 
            stroke-width="16" 
            stroke-linecap="round" 
            filter="url(#cGlow)" />
      <path d="M -130,130 A 180,180 0 1,1 170,-80" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="4" 
            stroke-linecap="round" 
            opacity="0.8" />

      <!-- Bottom-Right Lime Arc -->
      <path d="M 155,-60 A 180,180 0 0,1 -145,145" 
            fill="none" 
            stroke="url(#cNeonLime)" 
            stroke-width="16" 
            stroke-linecap="round" 
            filter="url(#cGlow)" />
      <path d="M 155,-60 A 180,180 0 0,1 -145,145" 
            fill="none" 
            stroke="#f7fee7" 
            stroke-width="4" 
            stroke-linecap="round" 
            opacity="0.8" />

      <!-- FX Letters -->
      <g transform="translate(-230, -250)">
        <!-- F -->
        <path d="M 145,150 L 330,150 L 305,200 L 225,200 L 210,240 L 285,240 L 265,290 L 190,290 L 140,410 L 80,410 Z" 
              fill="url(#cNeonBlue)" 
              stroke="#38bdf8" 
              stroke-width="4" 
              stroke-linejoin="round" />
        <!-- X -->
        <path d="M 330,140 L 235,275 L 345,410 L 275,410 L 195,305 L 155,360 L 95,360 L 165,260 L 215,190 L 265,140 Z" 
              fill="url(#cNeonLime)" 
              stroke="#a3e635" 
              stroke-width="4" 
              stroke-linejoin="round" />
      </g>
    </g>

    <!-- 2. RIGHT TYPOGRAPHY -->
    <g transform="translate(195, 100)">
      <!-- FINE -->
      <text font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" 
            font-weight="900" 
            font-size="96" 
            letter-spacing="3" 
            fill="url(#cChrome)" 
            stroke="#0f172a" 
            stroke-width="1.2">
        FINE
      </text>

      <!-- X -->
      <text x="300" 
            font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" 
            font-weight="900" 
            font-size="96" 
            letter-spacing="3" 
            fill="url(#cGreenX)" 
            stroke="#052e16" 
            stroke-width="1.2"
            filter="url(#cGlow)">
        X
      </text>

      <!-- — FITNESS — -->
      <g transform="translate(0, 42)">
        <path d="M 10, -5 L 130, -5 L 130, -1 L 10, -3 Z" fill="url(#cLineL)"/>
        <text x="215" y="0" 
              text-anchor="middle" 
              font-family="'Inter', system-ui, sans-serif" 
              font-weight="800" 
              font-size="24" 
              letter-spacing="10" 
              fill="url(#cSubMetal)" 
              stroke="#0f172a" 
              stroke-width="0.5">
          FITNESS
        </text>
        <path d="M 300, -5 L 420, -5 L 420, -3 L 300, -1 Z" fill="url(#cLineR)"/>
      </g>
    </g>
  </g>
</svg>

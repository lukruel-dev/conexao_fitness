name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: conexao-fitness-frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web App
        working-directory: conexao-fitness-frontend
        run: npm run build

      - name: Remove stale Android platform and re-sync
        working-directory: conexao-fitness-frontend
        run: |
          # Remove the existing android dir (it was committed from Windows and may have stale paths)
          rm -rf android

          # Re-create the native Android project from scratch
          npx cap add android

          # Sync web assets + plugins into native project
          npx cap sync android

          # Debug: verify capacitor AAR libs exist
          echo "=== Checking Capacitor AAR libs ==="
          ls -la node_modules/@capacitor/android/capacitor/libs/ || echo "WARNING: libs dir missing"
          ls -la android/capacitor/ || echo "WARNING: android/capacitor missing"
          echo "=== Capacitor Android project contents ==="
          ls -la android/app/src/main/assets/public/ | head -5 || echo "WARNING: web assets missing"

      - name: Build Android APK
        working-directory: conexao-fitness-frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConexaoFitness-Android-APK
          path: conexao-fitness-frontend/android/app/build/outputs/apk/debug/app-debug.apk

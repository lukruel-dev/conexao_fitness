name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        working-directory: conexao-fitness-frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web App
        working-directory: conexao-fitness-frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: conexao-fitness-frontend
        run: npx cap sync android

      - name: Build Android APK
        working-directory: conexao-fitness-frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConexaoFitness-Android-APK
          path: conexao-fitness-frontend/android/app/build/outputs/apk/debug/app-debug.apk

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Neon Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Lime Gradient -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="32" fill="url(#bgGlow)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="100" fill="#00a8ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="300" cy="220" r="100" fill="#84cc16" opacity="0.15" filter="url(#glow)"/>

  <!-- Badge Outer Ring (Neon Split) -->
  <!-- Blue Arch (Top-Left) -->
  <path d="M 160,280 A 130,130 0 1,1 350,150" fill="none" stroke="url(#neonBlue)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Lime Arch (Bottom-Right) -->
  <path d="M 340,160 A 130,130 0 0,1 150,290" fill="none" stroke="url(#neonLime)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- FX Monogram Symbol -->
  <g transform="translate(145, 110)">
    <!-- Letter F (Blue) -->
    <path d="M 20,15 L 110,15 L 95,45 L 55,45 L 45,75 L 85,75 L 70,105 L 35,105 L 5,175 L -20,175 Z" fill="url(#neonBlue)"/>
    <!-- Letter X (Lime Green) -->
    <path d="M 125,45 L 85,115 L 125,175 L 95,175 L 68,130 L 45,165 L 20,165 L 53,115 L 75,80 L 100,45 Z" fill="url(#neonLime)"/>
  </g>

  <!-- FINEX Typography -->
  <g transform="translate(250, 390)" text-anchor="middle">
    <text font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="4">
      <tspan fill="#ffffff">FINE</tspan><tspan fill="url(#neonLime)">X</tspan>
    </text>
  </g>

  <!-- FITNESS Subtitle & Accents -->
  <g transform="translate(250, 430)" text-anchor="middle">
    <!-- Left Accent Line -->
    <line x1="-140" y1="-6" x2="-70" y2="-6" stroke="url(#neonLime)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Subtitle Text -->
    <text font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="8" fill="#e2e8f0">FITNESS</text>
    <!-- Right Accent Line -->
    <line x1="70" y1="-6" x2="140" y2="-6" stroke="url(#neonLime)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
